name: Publish Jam Room
on:
  push:
    branches: [main, claude/lucid-feynman-19lewz]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/assemble.py
      - run: |
          mkdir site
          cp dist/jam-room.html site/index.html
          cp dist/jam-room.html site/jam-room.html
          cp dist/jam-room.html site/jam-room-share.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
