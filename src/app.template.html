<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jam Room</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jam Room">
<meta name="theme-color" content="#0c1712">
<meta name="color-scheme" content="dark">
<style>/*@include css/studio.css*/</style>
<style>/*@include css/kit.css*/</style>
<style>/*@include css/learn.css*/</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
<radialGradient id="gGold" cx="50%" cy="40%" r="65%"><stop offset="0" stop-color="#f6e2a0"/><stop offset=".55" stop-color="#cfa650"/><stop offset="1" stop-color="#8a6a2a"/></radialGradient>
<radialGradient id="gGoldD" cx="50%" cy="40%" r="65%"><stop offset="0" stop-color="#d9bd73"/><stop offset=".6" stop-color="#a98439"/><stop offset="1" stop-color="#6a501f"/></radialGradient>
<radialGradient id="gHead" cx="50%" cy="40%" r="70%"><stop offset="0" stop-color="#fffaf0"/><stop offset=".7" stop-color="#eadfc4"/><stop offset="1" stop-color="#c9b98f"/></radialGradient>
<linearGradient id="gShellP" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f8160"/><stop offset="1" stop-color="#15352a"/></linearGradient>
<linearGradient id="gShellS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c3cbd0"/><stop offset="1" stop-color="#6b767c"/></linearGradient>
<linearGradient id="gChrome" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f6f7"/><stop offset=".5" stop-color="#b9c1c6"/><stop offset="1" stop-color="#7b858b"/></linearGradient>
<linearGradient id="gMetal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7f898f"/><stop offset=".45" stop-color="#c4ccd1"/><stop offset="1" stop-color="#6d777d"/></linearGradient>
<radialGradient id="gKick" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#22362d"/><stop offset="1" stop-color="#0b1410"/></radialGradient>
<radialGradient id="gSkin" cx="50%" cy="40%" r="70%"><stop offset="0" stop-color="#f4dfb8"/><stop offset="1" stop-color="#c79660"/></radialGradient>
<linearGradient id="gWood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c9985c"/><stop offset=".5" stop-color="#e2bd83"/><stop offset="1" stop-color="#b3824a"/></linearGradient>
<linearGradient id="gConga" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a5226"/><stop offset=".45" stop-color="#d28e48"/><stop offset="1" stop-color="#7a4a22"/></linearGradient>
</defs></svg>
<header class="top">
  <div class="bar">
    <div class="brand"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--wood)"/><path d="M7 23V10M11.5 23V7M16 23V12M20.5 23V8M25 23v-9" stroke="var(--brass)" stroke-width="2.4" stroke-linecap="round"/></svg><span>Jam Room</span></div>
    <div class="modes" role="tablist" aria-label="Section"><button data-mode="studio" aria-pressed="true" data-ic="studio"><span>Studio</span></button><button data-mode="orch" aria-pressed="false" data-ic="violin"><span>Orchestra</span></button><button data-mode="learn" aria-pressed="false" data-ic="learn"><span>Learn</span></button></div>
    <div class="transport">
      <button id="bPlay" class="round play" aria-label="Play"></button>
      <button id="bRec" class="round rec" aria-label="Record"></button>
      <div class="lcd">
        <div class="lcd-cell"><small>Position</small><div class="pos" id="pos" aria-live="off">Bar 1 · 1</div></div>
        <div class="lcd-cell bpm"><small>Tempo</small><div class="bpmrow"><button id="bpmDn" aria-label="Slower">−</button><input id="bpm" type="number" min="40" max="220" value="100" aria-label="Tempo in beats per minute"><button id="bpmUp" aria-label="Faster">+</button></div></div>
        <div class="lcd-cell lvl"><small>Level</small><div class="vu" title="Output level. If it turns red, lower some track volumes."><i id="vu"></i></div></div>
      </div>
      <button id="bUndo" class="ib" aria-label="Undo" title="Undo (Ctrl+Z)" disabled><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button id="bRedo" class="ib" aria-label="Redo" title="Redo (Ctrl+Shift+Z)" disabled><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    </div>
    <div class="seg" role="group" aria-label="Playback options">
      <button class="tog" id="tMetro" aria-pressed="false" title="Metronome click" aria-label="Metronome" data-ic="metro"><span>Click</span></button>
      <button class="tog" id="tCount" aria-pressed="true" title="Count-in: 4 clicks before recording" aria-label="Count-in" data-ic="count"><span>Count-in</span></button>
      <button class="tog" id="tLoop" aria-pressed="true" title="Loop playback" aria-label="Loop" data-ic="loop"><span>Loop</span></button>
      <button class="tog" id="tMon" aria-pressed="false" title="Hear myself: your voice in your headphones while recording" aria-label="Hear myself" data-ic="phones"><span>Hear myself</span></button>
    </div>
    <div class="spacer-flex"></div>
    <span class="ver" title="Version of Jam Room you are using">v@@BUILD@@</span>
    <button id="bDisp" class="tool" data-ic="eye" title="Display: comfort colours, text size, calm motion"><span>Display</span></button>
    <button id="bMenu" class="tool primary-soft" data-ic="share"><span>Save &amp; share</span></button>
  </div>
  <div class="bar bar2">
    <label>Key <select id="key" aria-label="Key"></select></label>
    <label>Scale <select id="scale" aria-label="Scale"></select></label>
    <label>Length <select id="bars" aria-label="Song length in bars"></select></label>
    <label title="Swing shifts every other 16th note late for a laid-back groove">Feel <select id="feel"><option value="0">Straight</option><option value="0.12">Light swing</option><option value="0.25">Swing</option><option value="0.38">Heavy swing</option></select></label>
    <label title="The room your reverb simulates">Space <select id="space"><option>Room</option><option>Studio</option><option>Hall</option><option>Plate</option><option>Cathedral</option></select></label>
    <button id="bTune" class="chip" title="Reference pitch: the frequency of the note A. Tap to change it.">A = 440 Hz</button>
    <div class="spacer-flex"></div>
    <div class="tools" id="tools">
      <button id="bStart" class="tool" title="Start a new song from a vibe" data-ic="wand"><span>Starter</span></button>
      <button id="bLoops" class="tool" title="Ready-made loops that fit your song: drums, bass, chords, melodies" data-ic="loops"><span>Loops</span></button>
      <button id="bChords" class="tool" title="Chord helper: build a chord progression, see what comes next, and learn why it works" data-ic="chords"><span>Chords</span></button>
      <button id="bMix" class="tool" title="Balance all your tracks" data-ic="mixer"><span>Mixer</span></button>
      <button id="bPolish" class="tool" title="Balance every track and add a finished sound in one tap" data-ic="polish"><span>Polish</span></button>
      <span class="tsep"></span>
      <button id="bOut" class="ib" title="Sound output and sound check" aria-label="Sound output" data-ic="speaker"></button>
      <button id="bFull" class="ib" title="Full screen" aria-label="Full screen" data-ic="full"></button>
      <button id="bGuide" class="ib" title="How everything works" aria-label="Guide" data-ic="help"></button>
    </div>
  </div>
</header>

<div class="main" id="main">
  <div class="welcome" id="welcome" hidden>
    <div class="steps">
      <div class="step"><b>1</b><span><strong>Pick a sound</strong><br>Tap the instrument name on a track.</span></div>
      <div class="step"><b>2</b><span><strong>Play or tap</strong><br>Use the keyboard below, or tap the grid to add notes.</span></div>
      <div class="step"><b>3</b><span><strong>Record</strong><br>Press the red button. Add a Voice track to sing over it. Tap <b>? Guide</b> any time.</span></div>
    </div>
    <button id="welcomeX">Got it</button>
  </div>
  <section class="col">
    <div id="obarHost"></div>
    <div class="song" id="song"></div>
    <div class="hear" id="hear" role="group" aria-label="Choose which instruments you hear"></div>
    <div id="trackList" class="col"></div>
    <div class="adds">
      <button id="addInst">+ Instrument</button>
      <button id="addDrums">+ Drums</button>
      <button id="addVoice">+ Voice</button>
      <button id="addLoop">+ Loop</button>
    </div>
  </section>
  <section class="editor" id="editor"></section>
</div>

<footer class="dock" id="dock"></footer>
<section class="learn" id="learn" hidden></section>
<section class="orch" id="orch" hidden></section>

<input type="file" id="file" accept=".json,application/json" hidden>
<div class="toast" id="toast" role="status"></div>
<div class="modal" id="modal"><div class="mbox" id="mBox"></div></div>

var LT=null;

  if(!S.liveTune||!mic||!A.c)return false;
  var c=A.c;
  try{
    if(typeof window.SignalsmithStretch!=='function'||typeof AudioWorkletNode!=='function')throw new Error('unsupported');
    var node=await SignalsmithStretch(c,{numberOfInputs:1,numberOfOutputs:1,outputChannelCount:[1]});
    await node.configure({blockMs:40,intervalMs:10});
    if(!P.cap||!mic)return false;
    var an=c.createAnalyser(),g=c.createGain();an.fftSize=2048;g.gain.value=1;
    mic.src.connect(an);mic.src.connect(node);node.connect(g);g.connect(t.vin||t.node);

    var last=t.takes[t.takes.length-1],speed=last?last.speed:40,amt=last?last.strength/100:1,al=vtScaleNotes(S.key,SCALES[S.scale]);
    var buf=new Float32Array(2048),st={},cur=0,y=0,lastT=c.currentTime;

      if(m){if(speed>10){st.ema=(st.ema&&Math.abs(st.ema-m)<1)?st.ema+(m-st.ema)*.35:m;m=st.ema;}cur=(vtNearest(m,al)-m)*amt;}

    },20);

  }catch(e){LT=null;return false;}
}

document.addEventListener('keydown',function(e){

function tidyNotes(t,str,grid,only){
  var L=LEN(),g=1/grid,out=[];
  t._undo=JSON.parse(JSON.stringify(t.notes));
  t.notes.slice().sort(function(a,b){return a.s-b.s;}).forEach(function(n){
    if(only&&!only.has(n)){out.push(n);return;}
    var s=n.s+(Math.round(n.s/g)*g-n.s)*str,e=n.s+n.d;e=e+(Math.round(e/g)*g-e)*str;
    if(s>=L-1e-6)s-=L;if(s<0)s=0;s=Math.round(s*10000)/10000;
    var d=t.kind==='drum'?.25:Math.max(g*(str>=1?1:.5),e-s);d=Math.min(d,L-s);
    if(!out.some(function(o){return o.m===n.m&&Math.abs(o.s-s)<1e-4;}))out.push({s:s,d:d,m:n.m,v:n.v});
  });
  t.notes=out;
}
function applyBeat(t,name){
  t._undo=null;
  var p=BEATS[name];if(!p)return;t.notes=[];
  for(var bar=0;bar<S.bars;bar++){
    Object.keys(p).forEach(function(pi){p[pi].forEach(function(st){
      var v=(+pi===3||+pi===9)?(st%4===0?.9:(st%2===0?.65:.45)):.85;
      t.notes.push({s:bar*4+st*.25,d:.25,m:+pi,v:v});
    });});
  }
}

function waveDraw(cv,raw){
  var w=cv.clientWidth||300,h=44,d=window.devicePixelRatio||1;cv.width=w*d;cv.height=h*d;
  var g=cv.getContext('2d');g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,w,h);g.fillStyle=theme().ink;g.globalAlpha=.55;
  var step=Math.max(1,Math.floor(raw.length/w));
  for(var x=0;x<w;x++){var mx=0,i0=x*step;for(var i=i0;i<i0+step&&i<raw.length;i+=8){var a=Math.abs(raw[i]);if(a>mx)mx=a;}var bh=Math.max(1,mx*h*.95);g.fillRect(x,(h-bh)/2,1,bh);}
}

function importAudio(f,t){
  var c=ensureAudio(),r=new FileReader();
  r.onload=function(){
    decodeBuf(c,r.result).then(function(b){
      if(b.duration>300){toast('That recording is longer than 5 minutes');return;}
      var n=b.numberOfChannels,len=b.length,raw=new Float32Array(len),ch,i;
      for(ch=0;ch<n;ch++){var d=b.getChannelData(ch);for(i=0;i<len;i++)raw[i]+=d[i]/n;}
      t.takes.push(newTake('Import '+(t.takes.length+1),raw,b.sampleRate));
      renderEditor();markDirty();toast('Added "'+f.name+'" as a take');
    }).catch(function(){toast('Could not read that audio file');});
  };
  r.readAsArrayBuffer(f);
}

function toB64(i16){var u8=new Uint8Array(i16.buffer),s='';for(var i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);}
function fromB64(b){var s=atob(b),u8=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u8[i]=s.charCodeAt(i);return new Int16Array(u8.buffer);}

}

function mkTakeFrom(k,aud){
  var a=aud[k.id];if(!a)return null;
  var nk=Object.assign({o:null,tb:null,ty:null,tsig:'',speed:40,form:0,edits:[],strength:100},k,{raw:a.f,sr:a.sr}),old=TAKES[k.id];
  if(old&&old.raw===a.f)['an','ty','tsig','tb','o','segs','curve','showPitch'].forEach(function(f){if(old[f]!==undefined)nk[f]=old[f];});
  return nk;
}
function applyProject(d,aud,opts){
  opts=opts||{};
  if(P.playing)stop();
  var keepSel=opts.keepView?S.sel:null,keepSolo=opts.keepView&&S.solo?S.solo.slice():null;
  S.solo=null;S.tracks.forEach(unwireTrack);
  S.name=d.name||'My song';S.bpm=d.bpm||100;S.key=d.key||0;S.scale=SCALES[d.scale]?d.scale:'Major';S.bars=d.bars||4;
  S.loop=d.loop!==false;S.swing=+d.swing||0;S.space=SPACES[d.space]?d.space:'Studio';if(A.c)A.rev.buffer=makeIR(A.c,S.space);S.metro=!!d.metro;S.count=d.count!==false;S.liveTune=!!d.liveTune;
  S.master=d.master!=null?+d.master:.85;if(A.master)A.master.gain.value=S.master;
  setRef(d.tune!=null?+d.tune:prefTune(),true);S.fin=!!d.fin;S.mst=d.mst||'';applyFin();
  S.parts=(d.parts&&d.parts.length)?d.parts.map(function(p){return{id:p.id,name:p.name};}):[{id:'p1',name:'Main'}];
  S.part=S.parts.some(function(p){return p.id===d.part;})?d.part:S.parts[0].id;
  S.chords=d.chords||{};S.osty=d.osty;
  var aoff=d.arrOff||[],apairs=(d.arr||[S.part]).map(function(id,i){return[id,aoff[i]||{}];}).filter(function(x){return S.parts.some(function(p){return p.id===x[0];});});
  S.arr=apairs.map(function(x){return x[0];});S.arrOff=apairs.map(function(x){return x[1];});if(!S.arr.length){S.arr=[S.part];S.arrOff=[{}];}
  S.songMode=!!d.songMode;
  S.tracks=(d.tracks||[]).map(function(x){
    var t=Object.assign(mkTrack(x.kind,x.inst),x);t.node=null;t.vn=null;t.send=null;t.fxs=null;t.fx=Object.assign(fxZero(),x.fx||{});t.notes=x.notes||[];
    t.takes=(x.takes||[]).map(function(k){return mkTakeFrom(k,aud);}).filter(Boolean);
    t.pd={};
    Object.keys(x.pd||{}).forEach(function(pid){
      if(pid===S.part||!S.parts.some(function(p){return p.id===pid;}))return;
      var q=x.pd[pid];t.pd[pid]={notes:q.notes||[],takes:(q.takes||[]).map(function(k){return mkTakeFrom(k,aud);}).filter(Boolean),auto:q.auto||{}};
    });
    return t;
  });
  if(A.c)S.tracks.forEach(wireTrack);
  if(keepSel&&trackById(keepSel))S.sel=keepSel;
  else S.sel=(S.tracks.filter(function(t){return t.kind==='inst';})[0]||S.tracks[0]||{}).id||null;
  var kt=keyTrack();S.lastInst=kt?kt.id:null;
  if(keepSolo){S.solo=keepSolo;normSolo();applyGains();}
  syncHeader();renderAll();
  S.tracks.forEach(function(t){allTakes(t).forEach(function(k){if(k.tune)tuneTake(k);});});
}
function audFromRecord(rec){var m={};Object.keys(rec.audio||{}).forEach(function(id){m[id]={sr:rec.audio[id].sr,f:i162f(new Int16Array(rec.audio[id].pcm))};});return m;}
function starter(){
  setRef(prefTune(),true);S.fin=false;S.mst='';applyFin();
  S.parts=[{id:'p1',name:'Main'}];S.part='p1';S.arr=['p1'];S.arrOff=[{}];S.chords={};S.songMode=false;
  S.solo=null;S.swing=0;if(S.space!=='Studio'){S.space='Studio';if(A.c)A.rev.buffer=makeIR(A.c,S.space);}S.tracks.forEach(unwireTrack);S.tracks=[];S.name='My song';S.bpm=100;S.key=0;S.scale='Major';S.bars=4;
  var d=mkTrack('drum');S.tracks.push(d);applyBeat(d,'Rock');
  var p=mkTrack('inst','piano');S.tracks.push(p);
  S.tracks.push(mkTrack('voice'));

  S.sel=p.id;S.lastInst=p.id;syncHeader();renderAll();
}

function shareSave(name,data){
  try{
    if(!navigator.canShare||!navigator.share)return Promise.reject();
    var blob=data instanceof Blob?data:new Blob([data],{type:/\.json$/i.test(name)?'application/json':'text/plain'}),f=new File([blob],name,{type:blob.type});
    if(!navigator.canShare({files:[f]}))return Promise.reject();

}
function saveFile(name,data,label){

    shareSave(name,data).then(function(){toast('Saved '+name);},function(err){
      if(err&&err.name==='AbortError')return;

async function exportAudio(){
  if(P.playing)stop();
  var c=ensureAudio(),dest=c.createMediaStreamDestination(),types=['audio/webm;codecs=opus','audio/webm','audio/mp4'],mime='';
  if(typeof MediaRecorder==='undefined'){toast('Audio export isn\'t supported in this browser');return;}
  types.forEach(function(t){if(!mime&&MediaRecorder.isTypeSupported(t))mime=t;});
  var rec;try{rec=new MediaRecorder(dest.stream,mime?{mimeType:mime}:undefined);}catch(e){toast('Audio export isn\'t supported in this browser');return;}
  var chunks=[];rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data);};
  rec.onstop=function(){
    try{A.out.disconnect(dest);}catch(e){}
    var ext=(rec.mimeType||mime).indexOf('mp4')>=0?'.mp4':'.webm';
    var blob=new Blob(chunks,{type:rec.mimeType||mime||'audio/webm'});
    if(blob.size<1000){toast('Nothing was recorded');return;}
    saveFile(slug()+ext,blob,'Song audio');
  };
  A.out.connect(dest);rec.start();expo={rec:rec};
  toast('Exporting in real time. Keep this tab open.');
  start(false,{exporting:true,noCount:true});
}

'<dt>Arrange</dt><dd>Shows the whole song as a timeline: one column per section, one row per instrument, with a small picture of the notes. Tap a cell to drop that instrument out of that section (a quiet intro, a drum break) without making a new part. Drag a section name to move it, and use the bar underneath to duplicate, remove or <b>Make it unique</b> (gives that section its own copy of the part so you can vary it). <b>Play from section</b> starts playback there; double-tap a section to edit its notes.</dd>'+
'<dt>Automation</dt><dd>In the note editor, turn on <b>Automation</b> to draw how Volume, Pan, Reverb or Filter change over time. Tap the lane to add a point, drag points, double-tap to remove one, or pick a ready-made shape like Fade in, Swing left and right, or Sweep open. Volume is a percentage of the mixer level, so the mixer still works. Each part has its own automation.</dd>'+
'<dt>↶ Undo and ↷ Redo</dt><dd>Undo anything: notes, deleted tracks or takes, effects, new parts, even a song starter. Shortcuts: <span class="kbd">Ctrl</span>/<span class="kbd">Cmd</span> + <span class="kbd">Z</span>, add <span class="kbd">Shift</span> to redo.</dd>'+
'<dt>Mixer</dt><dd>Every track side by side with a level meter, volume, pan, reverb, mute and solo, plus a master volume. Press play and balance by ear; if a meter turns red, turn that track down.</dd>'+
'<dt>WAV export</dt><dd>In Save &amp; share, Download WAV makes a full-quality file of your whole song (or the part you are on), faster than real time.</dd></dl></section>'+
'<section class="gsec" id="g-tracks"><h4>Tracks</h4><dl><dt>Loops</dt><dd>Tap <b>Loops</b> (or <b>+ Loop</b>) for ready-made drums, bass lines, chords, strums, arpeggios and melodies. They are all written in your song\'s key and follow the <b>Chords</b> chosen at the top (Jam Room can read the chords from your song), so any loops you pick fit together. Press ▶ to hear one; while your song plays, the preview starts in time on the next bar. <b>＋ Track</b> adds it as a new track; <b>Use here</b> puts the notes on the selected track.</dd><dt>Drummer</dt><dd>On a drum track, tap <b>Drummer</b>. Pick a style (Rock, Funk, Bossa nova, Jazz swing and more) and drag the dot: left is simple, right is busy, bottom is soft, top is loud. Choose fills, try <b>New take</b> for a slightly different performance, or tick <b>Whole song</b> so the drummer plays every part, calmer in the intro and bigger in the chorus.</dd><dt>Track card</dt><dd>Each instrument, drum kit or voice has its own card. Tap it to select it; the editor and keyboard then work on that track.</dd>'+
'<dt>Instrument button</dt><dd>Opens the instrument browser: 76 sounds in 12 families, with search and favorites (tap ☆). Tap a card to hear a short phrase, double-tap or press Use to pick it. <b>Recorded</b> sounds are real instruments sampled note by note; <b>Synth</b> ones are generated live.</dd>'+
'<dt>Drum kit</dt><dd>Nine kits, all recorded: an acoustic kit in Studio, Tight and Lo-fi flavours, the classic drum machines (Roland TR-808, LinnDrum, Roland CR-8000, Drumtraks, Casio RZ-1) and a hand percussion kit with cajón, congas, bongo and shakers. Pad names change with the kit.</dd>'+
'<dt>Volume, Reverb, Mute, ✕</dt><dd>Loudness, how much room echo, silence the track, delete it.</dd></dl></section>'+
'<section class="gsec" id="g-hear"><h4>Hear bar</h4><p>Tap a numbered chip to hear only that track. Tap others to add them back, or tap a lit chip to take it out. <b>Hear all</b> brings everything back. Exports include only what you are hearing.</p></section>'+
'<section class="gsec" id="g-editor"><h4>Note grid and drum grid</h4><dl><dt>Grid</dt><dd>Rows are notes (or drums), columns are 16th notes, numbered by bar. Tap empty space to add a note. Tap a row name to hear it.</dd>'+
'<dt>Select, move, stretch</dt><dd>Tap a note to select it (it gets a white outline). Drag it to move it in time or pitch; drag its right edge to make it longer or shorter. Double-tap a note to delete it. Notes snap to the <b>Grid</b> setting while you drag.</dd>'+
'<dt>Select several notes</dt><dd>Switch to <b>Select</b> and drag a box around notes, or use <b>Select all</b>. With a mouse you can drag a box in Edit mode too, and Shift-click adds notes to the selection. In Edit mode, dragging empty space with a finger or pen scrolls the grid.</dd>'+
'<dt>Copy, paste, duplicate</dt><dd><b>Copy</b> then tap the bar numbers at the top to place the gold paste marker, then <b>Paste</b>. <b>Duplicate</b> repeats the selected notes straight after themselves, handy for turning one bar into four. Keyboard: <span class="kbd">Ctrl</span>+<span class="kbd">C</span> / <span class="kbd">X</span> / <span class="kbd">V</span> / <span class="kbd">D</span> / <span class="kbd">A</span>, <span class="kbd">Delete</span>.</dd>'+
'<dt>Transpose</dt><dd>Moves the selected notes (or every note, if none are selected) up or down. With Scale lock on, +1 and −1 move one step within your key. Arrow keys move selected notes: left/right in time, up/down in pitch, Shift+up/down by an octave.</dd>'+
'<dt>Velocity</dt><dd>How hard each note is played. Turn on <b>Velocity</b> to see a lane of bars under the grid: drag across it to paint softer or louder notes, or drag a selected note\'s bar to change all selected notes together.</dd>'+
'<dt>Note length</dt><dd>How long new notes are when you tap the grid. With notes selected, it changes their length.</dd><dt>Tidy timing</dt><dd>Lines notes up to the beat; only the selected notes if any are selected.</dd><dt>Starter beat</dt><dd>Fills a drum track with a ready-made groove you can edit.</dd><dt>Clear notes</dt><dd>Empties the track (tap twice).</dd></dl></section>'+
'<section class="gsec" id="g-effects"><h4>Mix and effects</h4><dl><dt>Pan and Tone</dt><dd>Pan places a track left or right; Tone makes it darker or brighter. Double-click either to reset.</dd>'+
'<dt>Fuzz</dt><dd>Gritty distortion, great on guitars and bass.</dd><dt>Squash</dt><dd>Heavy compression that makes drums punchy and big.</dd><dt>Phaser</dt><dd>A slow swirling sweep, very 70s and very Tame Impala.</dd>'+
'<dt>Chorus</dt><dd>Doubles the sound slightly out of tune for width and shimmer.</dd><dt>Tape</dt><dd>Warm saturation and gentle wobble, like an old tape machine.</dd><dt>Echo</dt><dd>Repeats in time with your tempo.</dd><dt>Style</dt><dd>Presets that set several effects at once.</dd></dl></section>'+
'<section class="gsec" id="g-keys"><h4>Playing</h4><dl><dt>Chord strips</dt><dd>Set <b>Play</b> to <b>Chord strips</b> for one tall strip per chord of your key, like on a tablet. Tap high on a strip for a higher-sounding chord and low for a lower one; the three zones at the bottom play bass notes. Slide your finger up or down a strip to strum through it.</dd><dt>Autoplay</dt><dd>Pick a pattern under <b>Autoplay</b>, then hold a chord (a strip or a chord button): the instrument plays it for you in time, as a strum, fingerpicking, an arpeggio, a pulse or a bass groove, depending on the instrument. Change chords whenever you like; it keeps time. Record while using Autoplay and the notes it plays go into your track.</dd><dt>Scale lock</dt><dd>Keys outside your scale are greyed out and snap to the nearest right note.</dd>'+
'<dt>Keys: Piano (2 rows)</dt><dd>Your computer keyboard works like a piano. Bottom row <span class="kbd">Z</span> to <span class="kbd">/</span> is one octave (with <span class="kbd">S D G H J</span> as black keys); top row <span class="kbd">Q</span> to <span class="kbd">P</span> is the next octave up (numbers are black keys).</dd>'+
'<dt>Keys: Scale + chords</dt><dd>Every letter key plays a note in your scale, so nothing sounds wrong, and number keys <span class="kbd">1</span> to <span class="kbd">7</span> play chords.</dd>'+
'<dt>Chord buttons</dt><dd>One tap plays a full chord in your key. Roman numerals show the chord position (I, IV, V are the most common).</dd>'+
'<dt>Octave and Size</dt><dd>Shift the keyboard up or down (<span class="kbd">↑</span> <span class="kbd">↓</span> or scroll on the keys). Size makes the keys bigger; Focus hides the editor so the keyboard fills the screen.</dd>'+
'<dt>Sustain</dt><dd>Hold <span class="kbd">Shift</span> to let notes ring, like a piano pedal.</dd><dt>Auto-snap</dt><dd>Off by default, so recordings keep exactly what you played. Turn it on to line notes up to the beat while recording.</dd><dt>Tidy timing</dt><dd>Cleans up a recorded track afterwards. Gentle moves notes halfway to the beat and keeps your feel; Tight lines them up exactly. Undo tidy puts it back.</dd>'+
'<dt>MIDI keyboard</dt><dd>Plug in a USB keyboard and tap MIDI (Chrome or Edge). It plays at the strength you press.</dd>'+
'<dt>Touch and pen</dt><dd>On a touchscreen, how far down the key you tap sets the volume. A Surface Pen uses pressure instead.</dd><dt>Shortcuts</dt><dd><span class="kbd">Space</span> play or stop, <span class="kbd">Enter</span> record, <span class="kbd">Esc</span> stop. Drums: <span class="kbd">A</span> to <span class="kbd">H</span> and <span class="kbd">Z</span> to <span class="kbd">N</span>.</dd></dl></section>'+
'<section class="gsec" id="g-voice"><h4>Recording your voice</h4><dl><dt>Microphone</dt><dd>Tap Turn on microphone and allow access. Pick another mic from the list if you have one. Use headphones so the music doesn\'t leak into the recording.</dd>'+
'<dt>Takes</dt><dd>Every recording is a new take, so you can stack layers. Each take has volume, mute, delete and a timing nudge.</dd>'+
'<dt>Vocal sound</dt><dd>One-tap polish for the whole vocal track: Natural, Pop, Bedroom, Lo-fi or Radio. Each sets EQ, smoothing (compression), softer "s" sounds and a matching amount of reverb.</dd>'+
'<dt>Auto-tune</dt><dd>Turn it on for any take. Style picks the feel: <b>Robot</b> snaps instantly (the classic effect), <b>Tight</b> is polished, <b>Natural</b> keeps your vibrato and slides, <b>Gentle</b> is a light touch. Retune speed fine-tunes this, Amount sets how far notes move, and Character makes your voice deeper or brighter without changing the notes.</dd>'+
'<dt>Edit notes</dt><dd>Shows what you sang as a line over the notes. Drag a note up or down to change it, or pick Keep as sung for a note you bent on purpose. Auto puts it back.</dd>'+
'<dt>Harmonies</dt><dd>Add harmony makes a new take from your singing, a 3rd, 5th or octave away, always in your key. Try a 3rd above at low volume for a classic stacked sound.</dd>'+
'<dt>Hear auto-tune live</dt><dd>Hear yourself tuned in your headphones while you record (there is a small delay). New takes come out with auto-tune already on. Needs the microphone, so it works in the hosted version.</dd>'+
'<dt>Import a recording</dt><dd>Bring in an audio file, for example from your phone\'s voice recorder. Everything above works on imported takes too.</dd></dl></section>'+
'<section class="gsec" id="g-save"><h4>Saving and sharing</h4><p>Your work autosaves on this device. In <b>Save &amp; share</b> you can name and keep songs, export the song as audio, or save a project file to open on another device.</p></section>'+
'<section class="gsec" id="g-new"><h4>Tuning, polish, sharing and sound output</h4><dl><dt>A = 440 Hz (Tuning)</dt><dd>Sets the reference pitch for the whole song. 440 is standard for pop, rock, hip-hop and jazz; 432 is a mellower choice for ambient and acoustic music; 415 is for Baroque. Type any value you like. Every instrument and your recordings follow it.</dd><dt>Polish mix</dt><dd>One tap listens to every track, sets sensible levels (vocals and lead up front, bass and drums solid, chords and pads behind), spreads the backing sounds left and right, keeps low sounds dry and adds a gentle finish. A box shows what changed and lets you undo it.</dd><dt>Share a link to this song</dt><dd>Under Save &amp; share. Your friend opens the link and your song loads with all its instruments. Vocal recordings are left out. Jam Room needs to be on a web address, which you paste in once.</dd><dt>Output</dt><dd>Pick speakers, headphones or Bluetooth, or tap Fix sound if sound goes to the wrong place. iPad and iPhone choose this in Control Center instead.</dd></dl></section>'+
'<section class="gsec" id="g-surface"><h4>Using a Surface (or any touchscreen)</h4><dl><dt>Touch</dt><dd>Play with several fingers at once and slide along the keys for a glissando. Tap low on a key or pad for a loud note, high for a soft one.</dd><dt>Surface Pen</dt><dd>Press harder for louder notes. Draw on the grid to place notes.</dd><dt>Type Cover</dt><dd>The computer keyboard plays notes (see Playing). <span class="kbd">Space</span> plays, <span class="kbd">Enter</span> records, <span class="kbd">F11</span> goes full screen in Edge.</dd><dt>Tablet mode</dt><dd>Turn the Surface to portrait and the layout stacks; Size: Large or Huge plus Focus gives a big playing surface.</dd></dl></section>'+
'<section class="gsec" id="g-tips"><h4>10 ideas to try</h4><ol>'+
'<li>Pick the <b>Psych groove</b> starter beat, then add a <b>Mono bass</b> playing the root of each chord.</li>'+
'<li>Switch Keys to <b>Scale + chords</b> and play <span class="kbd">1</span> <span class="kbd">5</span> <span class="kbd">6</span> <span class="kbd">4</span>, one chord per bar. It\'s the progression behind countless pop songs.</li>'+
'<li>Set Feel to <b>Swing</b> with the Funk beat for an instant bounce.</li>'+
'<li>Use the Hear bar to loop just drums and bass while you write a melody.</li>'+
'<li>Put the <b>Dreamy synth</b> style on a Juno-style pad and set Space to Hall.</li>'+
'<li>Record the same vocal twice and pan one take left, one right, for a big double-tracked sound.</li>'+
'<li>Record a harmony a few notes above your melody and turn it down to sit underneath.</li>'+
'<li>Give drums <b>Squashed drums</b> plus a little Tape for a vintage feel.</li>'+
'<li>Pan guitars slightly left and keys slightly right so they don\'t crowd each other.</li>'+
'<li>Export your song and listen on your phone or in the car. Fix whatever sticks out.</li></ol></section>'+
'<div class="row" style="justify-content:flex-end"><button class="primary" data-x="close">Done</button></div></div>';
function openGuide(sec){
  openModal(GUIDE,function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.dataset.x==='close')closeModal();
    if(b.dataset.go){var el=$('g-'+b.dataset.go);if(el&&el.scrollIntoView)el.scrollIntoView({block:'start'});}
  });
  var el=$('g-'+(sec||'start'));if(el&&el.scrollIntoView&&sec&&sec!=='start')el.scrollIntoView({block:'start'});
}
document.addEventListener('click',function(e){var q=e.target.closest&&e.target.closest('[data-help]');if(q){e.stopPropagation();e.preventDefault();openGuide(q.dataset.help);}},true);
function renderAll(){renderSong();renderTracks();renderEditor();renderDock();setTransportUI();S.tracks.forEach(loadTrackSamples);}
setTransportUI();showWelcome();
/* =============== song parts: verse, chorus, ... =============== */
var PART_NAMES=['Intro','Verse','Pre-chorus','Chorus','Bridge','Drop','Outro'];
function partById(id){return S.parts.filter(function(p){return p.id===id;})[0]||null;}
function partName(id){var p=partById(id);return p?p.name:'Part';}
function partData(t,pid){if(!pid||pid===S.part)return{notes:t.notes,takes:t.takes,auto:t.auto};return(t.pd&&t.pd[pid])||{notes:[],takes:[]};}
function allTakes(t){var a=t.takes.slice();Object.keys(t.pd||{}).forEach(function(id){a=a.concat(t.pd[id].takes||[]);});return a;}
function songOn(){return!!S.songMode&&S.arr.length>0&&!P.rec;}
function passes(){return songOn()?S.arr.length:1;}
function passPart(pass){if(!songOn())return S.part;var n=S.arr.length;return S.arr[((pass%n)+n)%n];}
function switchPart(pid){
  if(pid===S.part||!partById(pid))return;
  S.tracks.forEach(function(t){t.pd=t.pd||{};t.pd[S.part]={notes:t.notes,takes:t.takes,auto:t.auto||{}};var d=t.pd[pid]||{notes:[],takes:[]};t.notes=d.notes;t.takes=d.takes;t.auto=d.auto||{};delete t.pd[pid];});
  S.part=pid;renderSong();renderEditor();markDirty();
}
function copyTake(k){return Object.assign({},k,{id:nid('k'),edits:JSON.parse(JSON.stringify(k.edits||[])),job:null,want:null,_rt:null,showPitch:false});}
function nextPartName(){for(var i=0;i<PART_NAMES.length;i++){var n=PART_NAMES[i];if(!S.parts.some(function(p){return p.name===n;}))return n;}return'Part '+(S.parts.length+1);}
function addPart(name,copy){
  var id=nid('p');S.parts.push({id:id,name:name});
  S.tracks.forEach(function(t){t.pd=t.pd||{};t.pd[id]=copy?{notes:JSON.parse(JSON.stringify(t.notes)),takes:t.takes.map(copyTake),auto:JSON.parse(JSON.stringify(t.auto||{}))}:{notes:[],takes:[],auto:{}};});
  if(copy&&S.chords&&S.chords[S.part])S.chords[id]=JSON.parse(JSON.stringify(S.chords[S.part]));
  arrInsert(S.arr.length,id,{});switchPart(id);
}
function deletePart(id){
  if(S.parts.length<2)return;
  if(id===S.part)switchPart(S.parts.filter(function(p){return p.id!==id;})[0].id);
  S.parts=S.parts.filter(function(p){return p.id!==id;});
  S.tracks.forEach(function(t){if(t.pd)delete t.pd[id];});if(S.chords)delete S.chords[id];
  arrNorm();for(var ai=S.arr.length-1;ai>=0;ai--)if(S.arr[ai]===id)arrRemove(ai);if(!S.arr.length){S.arr=[S.part];S.arrOff=[{}];}
  renderSong();markDirty();
}
function songLenText(){var sec=Math.round(S.arr.length*LEN()*spb());return S.arr.length+' section'+(S.arr.length>1?'s':'')+' · '+Math.floor(sec/60)+':'+('0'+(sec%60)).slice(-2);}
function renderSong(){
  var h=$('song');if(!h)return;
  var html='<div class="srow"><span class="hlabel">Parts</span><button class="qh" data-help="song" aria-label="Help" title="What is this?">?</button>'+
    S.parts.map(function(p){return'<button class="pchip" data-pid="'+p.id+'" aria-pressed="'+(p.id===S.part)+'" title="Edit this part">'+esc(p.name)+'</button>';}).join('')+
    '<button id="partAdd" title="Add a part, like a chorus">＋ Part</button><button id="partOpts" title="Rename, copy or delete this part" aria-label="Part options">⋯</button><button id="arrBtn" class="tog" aria-pressed="'+ARR.on+'" title="See the whole song as a timeline and arrange it">Arrange</button></div>';
  if(S.parts.length>1){
    html+='<div class="srow"><span class="hlabel">Song</span><button id="songMode" class="tog" aria-pressed="'+!!S.songMode+'" title="On: Play runs through every section in order. Off: Play loops the part you are editing.">'+(S.songMode?'Play whole song':'Loop this part')+'</button><div class="slots">'+
      S.arr.map(function(pid,i){return'<span class="slot" data-i="'+i+'"><select data-i="'+i+'" aria-label="Section '+(i+1)+'">'+S.parts.map(function(p){return'<option value="'+p.id+'"'+(p.id===pid?' selected':'')+'>'+esc(p.name)+'</option>';}).join('')+'</select><button data-rm="'+i+'" aria-label="Remove section">✕</button></span>';}).join('')+
      '<button id="slotAdd" title="Add a section to the end" aria-label="Add a section">＋</button></div><span class="muted slen">'+songLenText()+'</span></div>';
  }else html+='<p class="hint shint">Add parts like a verse and a chorus, then line them up into a full song.</p>';
  h.innerHTML=html;
}
function songTick(b){
  var h=$('song');if(!h)return;var on=-1;
  if(b!=null&&b>=0&&songOn())on=Math.floor(b/LEN())%S.arr.length;
  h.querySelectorAll('.slot').forEach(function(el){el.classList.toggle('now',+el.dataset.i===on);});
  if(ARR.on)document.querySelectorAll('#editor .arsec[data-i],#editor .arcell').forEach(function(el){el.classList.toggle('now',+el.dataset.i===on);});
}
$('song').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b||b.dataset.help)return;
  if(b.dataset.pid){switchPart(b.dataset.pid);return;}
  if(b.id==='partAdd'){partModal('add');return;}
  if(b.id==='partOpts'){partModal('opts');return;}
  if(b.id==='arrBtn'){arrToggle();return;}
  if(b.id==='songMode'){S.songMode=!S.songMode;renderSong();markDirty();toast(S.songMode?'Play now runs through the whole song':'Play now loops the part you\'re editing');return;}
  if(b.id==='slotAdd'){arrInsert(S.arr.length,S.arr[S.arr.length-1]||S.part,{});renderSong();if(ARR.on)renderEditor();markDirty();return;}
  if(b.dataset.rm!=null){if(S.arr.length<2){toast('A song needs at least one section');return;}arrRemove(+b.dataset.rm);renderSong();if(ARR.on)renderEditor();markDirty();}
});
$('song').addEventListener('change',function(e){var i=e.target.dataset.i;if(i==null)return;S.arr[+i]=e.target.value;renderSong();if(ARR.on)renderEditor();markDirty();});
function partModal(mode){
  var cur=partById(S.part);
  if(mode==='add'){
    var nm=nextPartName();
    openModal('<h3>Add a part</h3><p class="hint">A part is a section of your song, like a verse or chorus. Each part has its own notes and recordings.</p><div class="row">'+PART_NAMES.map(function(n){return'<button data-name="'+n+'"'+(n===nm?' class="on"':'')+'>'+n+'</button>';}).join('')+'</div>'+
      '<div class="row"><input type="text" id="partName" maxlength="20" value="'+esc(nm)+'" aria-label="Part name"></div>'+
      '<div class="row"><label class="il"><input type="radio" name="pstart" value="copy" checked> Start from a copy of “'+esc(cur.name)+'”</label><label class="il"><input type="radio" name="pstart" value="empty"> Start empty</label></div>'+
      '<div class="row" style="justify-content:flex-end"><button data-x="close">Cancel</button><button class="primary" data-x="ok">Add part</button></div>',function(e){
      var b=e.target.closest('button');if(!b)return;
      if(b.dataset.name){$('partName').value=b.dataset.name;document.querySelectorAll('#mBox [data-name]').forEach(function(x){x.classList.toggle('on',x===b);});return;}
      if(b.dataset.x==='close'){closeModal();return;}
      if(b.dataset.x==='ok'){
        var name=($('partName').value||'').trim()||nextPartName(),cp=(document.querySelector('#mBox input[name=pstart]:checked')||{}).value!=='empty';
        closeModal();addPart(name,cp);toast('“'+name+'” added and added to the song. You\'re editing it now.');
      }
    });
  }else{
    openModal('<h3>Part: '+esc(cur.name)+'</h3><div class="row"><input type="text" id="partName" maxlength="20" value="'+esc(cur.name)+'" aria-label="Part name"><button data-x="ren">Rename</button></div>'+
      '<div class="row"><button data-x="dup">Make a copy</button><button data-x="del"'+(S.parts.length<2?' disabled':'')+'>Delete this part</button></div>'+
      '<div class="row" style="justify-content:flex-end"><button data-x="close">Close</button></div>',function(e){
      var b=e.target.closest('button');if(!b)return;var x=b.dataset.x;
      if(x==='close')closeModal();
      else if(x==='ren'){cur.name=($('partName').value||'').trim()||cur.name;closeModal();renderSong();markDirty();}
      else if(x==='dup'){closeModal();addPart(cur.name+' 2',true);toast('Copied. You\'re editing the copy.');}
      else if(x==='del'){twoTap(b,'Tap again to delete',function(){closeModal();deletePart(cur.id);toast('Part deleted. Undo brings it back.');});}
    });
  }
}

/* =============== undo / redo =============== */
function histSnap(){return JSON.stringify(snapshot());}
function cacheTakes(){S.tracks.forEach(function(t){allTakes(t).forEach(function(k){TAKES[k.id]=k;});});}
function commitHist(){
  clearTimeout(HIST.t);HIST.t=null;if(HIST.busy)return;
  var s=histSnap();cacheTakes();if(HIST.list[HIST.idx]===s){updUndo();return;}
  HIST.list=HIST.list.slice(0,HIST.idx+1);HIST.list.push(s);
  if(HIST.list.length>80)HIST.list.shift();
  HIST.idx=HIST.list.length-1;updUndo();
}
function histGo(dir){
  if(HIST.t)commitHist();
  var ni=HIST.idx+dir;
  if(ni<0||ni>=HIST.list.length){toast(dir<0?'Nothing to undo':'Nothing to redo');return;}
  HIST.busy=true;HIST.idx=ni;
  try{
    var d=JSON.parse(HIST.list[ni]),aud={};
    Object.keys(TAKES).forEach(function(id){aud[id]={sr:TAKES[id].sr,f:TAKES[id].raw};});
    applyProject(d,aud,{keepView:true});HIST.list[ni]=histSnap();
  }finally{HIST.busy=false;}
  updUndo();toast(dir<0?'Undone':'Redone');

function encodeWav(buf){
  var ch=Math.min(2,buf.numberOfChannels),sr=buf.sampleRate,L=buf.length,d=[],c,i;
  for(c=0;c<ch;c++)d.push(buf.getChannelData(c));
  var end=L;while(end>sr&&d.every(function(x){return Math.abs(x[end-1])<2e-4;}))end--;
  end=Math.min(L,end+Math.round(sr*.25));
  var n=end*ch,ab=new ArrayBuffer(44+n*2),v=new DataView(ab),p=0;
  function str(s){for(var q=0;q<s.length;q++)v.setUint8(p++,s.charCodeAt(q));}
  function u32(x){v.setUint32(p,x,true);p+=4;}function u16(x){v.setUint16(p,x,true);p+=2;}
  str('RIFF');u32(36+n*2);str('WAVE');str('fmt ');u32(16);u16(1);u16(ch);u32(sr);u32(sr*ch*2);u16(ch*2);u16(16);str('data');u32(n*2);
  for(i=0;i<end;i++)for(c=0;c<ch;c++){var s=Math.max(-1,Math.min(1,d[c][i]));v.setInt16(p,s<0?s*32768:s*32767,true);p+=2;}
  return new Blob([ab],{type:'audio/wav'});
}

/* ================= SOUND CHECK (find the crackle) =================

   Also measures how fast this device can make sound (offline render speed). */
var SC_STEPS=[
 {k:'tone',t:'A plain tone',d:'Just a steady beep, straight to the speakers. Nothing from Jam Room is involved.'},
 {k:'raw',t:'Piano, nothing else',d:'Recorded piano chords played directly, without the mixer or effects.'},
 {k:'chain',t:'Piano through the mixer',d:'The same chords through Jam Room’s volume and tone stage.'},
 {k:'rev',t:'Piano with reverb',d:'Adds the room echo (reverb).'},
 {k:'busy',t:'A busy song, screen still',d:'Drums, bass and chords together, with screen animations paused.'},
 {k:'draw',t:'A busy song, screen moving',d:'The same song while the screen animates heavily.'}];
function scChords(c,dest,t0,dur,inst){
  var prog=[[48,60,64,67],[45,57,60,64],[41,57,60,65],[43,55,59,62]],sp=.5,i=0;
  for(var t=t0;t<t0+dur-.6;t+=sp*2,i++){var ch=prog[i%4];ch.forEach(function(m){playInst(inst||'piano',c,dest,m,t,.75).release(t+sp*1.8);});}
}
function scBusy(c,dest,t0,dur){
  scChords(c,dest,t0,dur,'piano');var sp=.25,b=[36,36,33,29,31];
  for(var k=0,t=t0;t<t0+dur-.4;t+=sp,k++){
    drum(c,dest,3,t,.6,'Studio');if(k%4===0)drum(c,dest,0,t,.9,'Studio');if(k%8===4)drum(c,dest,1,t,.85,'Studio');
    if(k%2===0)playInst('ebass',c,dest,b[(k>>3)%5],t,.8).release(t+sp*1.6);
    if(k%4===2)playInst('strings',c,dest,72+[0,4,7][k%3],t,.5).release(t+sp*3);
  }

    $('mBox').innerHTML=h;
  }
  function stopRun(){if(run){run.stop();run=null;}}
  openModal('',async function(e){
    var b=e.target.closest('button');if(!b)return;var x=b.dataset.x;
    if(x==='close'){stopRun();closeModal();return;}
    if(x==='play'){if(run)return;wakeAudio();await scPrep();run=scRun(SC_STEPS[cur].k,6);draw();var me=run;setTimeout(function(){if(run===me){stopRun();draw();}},6400);return;}
    if(x==='ok'||x==='bad'){stopRun();R[SC_STEPS[cur].k]=x==='bad';cur++;draw();
      if(cur===SC_STEPS.length&&speed==null){busyMsg='measuring…';scBench().then(function(v){speed=v;if(v==null)busyMsg='not available in this browser';draw();});}return;}
    if(x==='back'){stopRun();cur=Math.max(0,cur-1);draw();return;}
    if(x==='again'){R={};cur=0;draw();return;}
    if(x==='copy'){var i=$('scCode');i.select();try{navigator.clipboard.writeText(i.value).then(function(){toast('Code copied');},function(){document.execCommand('copy');toast('Code copied');});}catch(er){document.execCommand('copy');toast('Code copied');}return;}
    if(x==='fix'){try{localStorage.setItem('jr-lite','1');localStorage.setItem('jr-lat','playback');}catch(er){}toast('Restarting with the safest settings…');dbPut('__auto__').then(function(){setTimeout(function(){location.reload();},400);});}
  });
  $('mBox').classList.add('med');draw();
}
window.__jr.soundCheck=openSoundCheck;window.__jr.scBench=scBench;

if(A.c===null&&0){}

(async function boot(){
  var rec=await dbGet('__auto__');
  var ok=false,shared=null,m=/[#&]s=([^&]+)/.exec(location.hash);
  if(m){try{shared=await unpackSong(decodeURIComponent(m[1]));}catch(e){shared=(e&&e.message==='old')?'old':false;}}
  if(shared&&shared!=='old'){
    if(rec&&rec.data&&rec.data.tracks&&rec.data.tracks.some(function(t){return t.notes&&t.notes.length;}))await dbPutRaw('Before shared song',rec);
    try{applyProject(shared,{});ok=true;}catch(e){ok=false;}
    try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
  }else if(rec&&rec.data&&rec.data.tracks&&rec.data.tracks.length){try{applyProject(rec.data,audFromRecord(rec));ok=true;}catch(e){}}
  if(!ok)starter();
  HIST.list=[];HIST.idx=-1;commitHist();
  /* fetch and decode every sound the song uses straight away, so the first notes are not late or silent */
  setTimeout(function(){try{S.tracks.forEach(loadTrackSamples);loadDrumKits();}catch(e){}},250);
  if(INPUT==='midi'&&navigator.requestMIDIAccess)setTimeout(enableMidi,600);
  if(shared&&shared!=='old'&&ok){
    markDirty();
    openModal('<h3>A song for you</h3><p class="hint">“'+esc(S.name)+'” was shared with you. Press Play to hear it, then change anything you like. It will not change the original.</p><div class="row" style="justify-content:flex-end"><button data-x="close">Look around</button><button class="primary" data-x="play">Play it</button></div>',
      function(e){var b=e.target.closest('button');if(!b)return;closeModal();if(b.dataset.x==='play')$('bPlay').click();});
  }else if(shared==='old')toast('This browser is too old to open that link. Update Safari or Chrome.');
  else if(shared===false)toast('That song link looks cut off. Ask for it again.');
})();})();
</script>
