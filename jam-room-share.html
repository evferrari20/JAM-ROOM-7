    openModal('<h3>Part: '+esc(cur.name)+'</h3><div class="row"><input type="text" id="partName" maxlength="20" value="'+esc(cur.name)+'" aria-label="Part name"><button data-x="ren">Rename</button></div>'+

    });

/* =============== undo / redo =============== */
function histSnap(){return JSON.stringify(snapshot());}
function cacheTakes(){S.tracks.forEach(function(t){allTakes(t).forEach(function(k){TAKES[k.id]=k;});});}
function commitHist(){
  clearTimeout(HIST.t);HIST.t=null;if(HIST.busy)return;
  var s=histSnap();cacheTakes();if(HIST.list[HIST.idx]===s){updUndo();return;}
  HIST.list=HIST.list.slice(0,HIST.idx+1);HIST.list.push(s);
  if(HIST.list.length>80)HIST.list.shift();
  HIST.idx=HIST.list.length-1;updUndo();
}
function histGo(dir){
  if(HIST.t)commitHist();
  var ni=HIST.idx+dir;
  if(ni<0||ni>=HIST.list.length){toast(dir<0?'Nothing to undo':'Nothing to redo');return;}
  HIST.busy=true;HIST.idx=ni;
  try{
    var d=JSON.parse(HIST.list[ni]),aud={};
    Object.keys(TAKES).forEach(function(id){aud[id]={sr:TAKES[id].sr,f:TAKES[id].raw};});
    applyProject(d,aud,{keepView:true});HIST.list[ni]=histSnap();
  }finally{HIST.busy=false;}
  updUndo();toast(dir<0?'Undone':'Redone');
  clearTimeout(dirtyT);dirtyT=setTimeout(function(){dbPut(slotKey());},900);
}
function updUndo(){var u=$('bUndo'),r=$('bRedo');if(u)u.disabled=HIST.idx<=0;if(r)r.disabled=HIST.idx>=HIST.list.length-1;}
$('bUndo').addEventListener('click',function(){histGo(-1);});
$('bRedo').addEventListener('click',function(){histGo(1);});
document.addEventListener('keydown',function(e){
  if(!(e.metaKey||e.ctrlKey)||e.altKey)return;
  var el=e.target,typing=el&&(el.tagName==='TEXTAREA'||(el.tagName==='INPUT'&&/^(text|number|search|email|url|)$/i.test(el.type||'')));
  if(typing)return;
  if(e.code==='KeyZ'){e.preventDefault();histGo(e.shiftKey?1:-1);}
  else if(e.code==='KeyY'){e.preventDefault();histGo(1);}
},true);

var SINK={id:'',label:''};try{SINK.id=localStorage.getItem('jr-sink')||'';SINK.label=localStorage.getItem('jr-sinkl')||'';}catch(e){}

function devKind(l){return/head|ear|buds|airpod|bluetooth|bt /i.test(l||'')?'headphones':(/speaker|built-in|realtek|surface/i.test(l||'')?'speakers':'other');}
function openOutput(){

  function draw(){

      if(!named())h+='<div class="outask"><p class="hint"><b>Your browser hides the names of your speakers and headphones until you allow it once.</b> Jam Room only reads the names. It does not listen.</p><button class="primary" data-x="names">Find my speakers and headphones</button></div>';
    }

  async function getNames(){try{var st=await navigator.mediaDevices.getUserMedia({audio:true});st.getTracks().forEach(function(t){t.stop();});}catch(er){toast('The names stay hidden unless you tap Allow on the browser prompt');}await refresh();}
  function pick(id,label){SINK.id=id;SINK.label=label||'';saveSink();return applySink(A.c||ensureAudio()).then(function(ok){draw();toast(ok||!id?(id?'Sound now plays on '+(label||'that device'):'Sound follows your computer'):'That device is not available');});}
  var latOpts=[['interactive','Instant (lowest delay, may crackle on busy songs)'],['balanced','Balanced (recommended)'],['playback','Smooth (cleanest sound, a little delay)']];
  openModal('<h3>Listening device</h3>'+
    (can?'<p class="hint">Choose where Jam Room plays. If sound goes to the wrong place, tap Fix sound.</p><div class="row"><button data-x="spk">Speakers</button><button data-x="hp">Headphones</button><button data-x="auto">Automatic</button></div><div class="outlist" id="outList"></div>'+(navigator.mediaDevices&&navigator.mediaDevices.selectAudioOutput?'<div class="row"><button data-x="choose">Choose in browser…</button></div>':'')
         :'<p class="hint">'+(ios?'iPad and iPhone choose where sound plays, not the page. To switch between the speaker, headphones or a Bluetooth speaker: swipe down from the top-right corner to open Control Center, press and hold the music box, tap the AirPlay icon, then pick your iPad, headphones or speaker.':'This browser cannot choose the output device from inside the page. Use your computer’s sound menu (the speaker icon near the clock) to pick speakers or headphones, then tap Fix sound.')+'</p><div class="outlist" id="outList"></div>')+
    (ios?'<p class="hint">Sound plays through the speakers even when your iPad’s silent switch is on.</p>':'')+
    '<div class="sc-entry"><div><b>Hearing crackle?</b><p class="hint">A one-minute listening test that finds what causes it on this device.</p></div><button class="primary" data-x="sc">Run sound check</button></div>'+
    '<label class="shl chk"><input type="checkbox" id="liteChk"'+(LITE?' checked':'')+'> Low-power sound <span class="hint">(fewer notes at once, shorter reverb, calmer animations, flat instrument view; for slower computers)</span></label>'+
    '<label class="shl">Sound smoothness<select id="latSel">'+latOpts.map(function(o){return'<option value="'+o[0]+'"'+(o[0]===LAT?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select></label><p class="hint">If you hear crackling, choose Smooth. Changing this restarts Jam Room and saves your song first.</p>'+
    '<div class="row" style="justify-content:space-between"><span class="row"><button data-x="fix">Fix sound</button><button data-x="test">Play test sound</button></span><button class="primary" data-x="close">Done</button></div>',
  async function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.classList.contains('outitem')){pick(b.dataset.id,b.dataset.l);return;}
    var x=b.dataset.x;
    if(x==='close')closeModal();
    else if(x==='test')soundTest();
    else if(x==='sc')openSoundCheck();
    else if(x==='auto')pick('','');
    else if(x==='names')getNames();

    else if(x==='choose'){try{var d=await navigator.mediaDevices.selectAudioOutput();await pick(d.deviceId,d.label);refresh();}catch(er){}}
    else if(x==='spk'||x==='hp'){
      if(!named()){toast('Allow device names first, then tap again');await getNames();}

      if(f)pick(f.deviceId,f.label);else toast(want==='headphones'?'No headphones found. Plug them in or connect them, then tap Headphones again.':'No speakers found by name. Pick one from the list.');
    }
  });
  $('mBox').classList.add('med');draw();if(can)refresh();
  $('liteChk').addEventListener('change',function(){try{localStorage.setItem('jr-lite',this.checked?'1':'0');}catch(er){}toast('Restarting with the new setting…');dbPut(slotKey()).then(function(){setTimeout(function(){location.reload();},400);});});
  $('latSel').addEventListener('change',function(){var v=this.value;try{localStorage.setItem('jr-lat',v);}catch(er){}toast('Restarting with the new setting…');dbPut(slotKey()).then(function(){setTimeout(function(){location.reload();},400);});});

$('bOut').addEventListener('click',openOutput);

/* ================= SOUND CHECK (find the crackle) =================
   Plays six short clips, each adding one more part of the sound engine. The first clip that crackles shows the cause.
   Also measures how fast this device can make sound (offline render speed). */
var SC_STEPS=[
 {k:'tone',t:'A plain tone',d:'Just a steady beep, straight to the speakers. Nothing from Jam Room is involved.'},
 {k:'raw',t:'Piano, nothing else',d:'Recorded piano chords played directly, without the mixer or effects.'},
 {k:'chain',t:'Piano through the mixer',d:'The same chords through Jam Room’s volume and tone stage.'},
 {k:'rev',t:'Piano with reverb',d:'Adds the room echo (reverb).'},
 {k:'busy',t:'A busy song, screen still',d:'Drums, bass and chords together, with screen animations paused.'},
 {k:'draw',t:'A busy song, screen moving',d:'The same song while the screen animates heavily.'}];
function scChords(c,dest,t0,dur,inst){
  var prog=[[48,60,64,67],[45,57,60,64],[41,57,60,65],[43,55,59,62]],sp=.5,i=0;
  for(var t=t0;t<t0+dur-.6;t+=sp*2,i++){var ch=prog[i%4];ch.forEach(function(m){playInst(inst||'piano',c,dest,m,t,.75).release(t+sp*1.8);});}
}
function scBusy(c,dest,t0,dur){
  scChords(c,dest,t0,dur,'piano');var sp=.25,b=[36,36,33,29,31];
  for(var k=0,t=t0;t<t0+dur-.4;t+=sp,k++){
    drum(c,dest,3,t,.6,'Studio');if(k%4===0)drum(c,dest,0,t,.9,'Studio');if(k%8===4)drum(c,dest,1,t,.85,'Studio');
    if(k%2===0)playInst('ebass',c,dest,b[(k>>3)%5],t,.8).release(t+sp*1.6);
    if(k%4===2)playInst('strings',c,dest,72+[0,4,7][k%3],t,.5).release(t+sp*3);
  }
}
async function scPrep(){await Promise.all([ensureSamples('piano'),ensureSamples('ebass'),ensureSamples('strings'),loadKit('Studio')]);}
function scRun(k,dur){
  var c=ensureAudio(),t0=c.currentTime+.15,bus=c.createGain(),stop=[],end=t0+dur;bus.gain.value=.8;
  if(k==='tone'){var o=c.createOscillator(),g=c.createGain();o.frequency.value=330;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.18,t0+.05);g.gain.setValueAtTime(.18,end-.1);g.gain.linearRampToValueAtTime(0,end);o.connect(g);g.connect(c.destination);o.start(t0);o.stop(end+.05);}
  else if(k==='raw'){bus.connect(c.destination);bus.gain.value=.45;scChords(c,bus,t0,dur);}
  else{
    bus.connect(A.master);var sd=null;if(k!=='chain'){sd=c.createGain();sd.gain.value=.3;bus.connect(sd);sd.connect(A.rev);}
    if(k==='rev'||k==='chain')scChords(c,bus,t0,dur);else scBusy(c,bus,t0,dur);
  }
  var cv=$('scCanvas'),raf=0;VIS_PAUSE=(k==='busy');
  if(k==='draw'&&cv){var x=cv.getContext('2d');(function f(ts){var w=cv.width=cv.clientWidth*2,h=cv.height=cv.clientHeight*2;for(var i=0;i<400;i++){x.fillStyle='hsl('+((i*7+ts/5)%360)+',45%,45%)';x.fillRect((i*37+ts/3)%w,(i*53)%h,40,40);}raf=requestAnimationFrame(f);})(0);}
  return{end:end,stop:function(){cancelAnimationFrame(raf);VIS_PAUSE=false;try{bus.gain.setTargetAtTime(0,c.currentTime,.02);}catch(e){}setTimeout(function(){try{bus.disconnect();}catch(e){}},400);}};
}
async function scBench(){
  /* render 6 s of the busy song through a copy of the master chain, as fast as possible; how many times faster than real time? */
  var c=ensureAudio(),sr=c.sampleRate,oc=new OfflineAudioContext(2,sr*6,sr),saveA=A,res=null;
  try{A={c:oc,off:true};buildGraph(oc);var bus=oc.createGain();bus.connect(A.master);var sd=oc.createGain();sd.gain.value=.3;bus.connect(sd);sd.connect(A.rev);scBusy(oc,bus,.05,6);
    var t=performance.now();A=saveA;await oc.startRendering();res=6/((performance.now()-t)/1000);}
  catch(e){res=null;}finally{A=saveA;}
  return res;
}
function scBrowser(){var u=navigator.userAgent;return/Edg\//.test(u)?'Edge':/Chrome\//.test(u)?'Chrome':/Safari\//.test(u)?'Safari':/Firefox\//.test(u)?'Firefox':'Other';}
function openSoundCheck(){
  var R={},cur=0,run=null,speed=null,busyMsg='';
  function info(){var c=A.c||ensureAudio();return{sr:c.sampleRate,base:Math.round((c.baseLatency||0)*1000),out:Math.round((c.outputLatency||0)*1000)};}
  function code(){var i=info();return'JR-SC '+scBrowser()+' '+i.sr+'Hz b'+i.base+' o'+i.out+' '+LAT[0]+(LITE?'L':'')+' '+SC_STEPS.map(function(st,j){return(j+1)+(R[st.k]==null?'?':R[st.k]?'X':'ok');}).join(' ')+(speed?' x'+speed.toFixed(1):'');}
  function diagnose(){
    var first=-1;SC_STEPS.forEach(function(st,j){if(first<0&&R[st.k])first=j;});
    var slow=speed!=null&&speed<10;
    if(first<0)return['<b>Everything played clean.</b> If a song still crackles, note which song and when, and send me the code below.',''];
    var k=SC_STEPS[first].k;
    if(k==='tone')return['<b>Even a plain beep crackles, so the problem is outside Jam Room</b>, in Windows sound settings or the device itself. Try these, one at a time:<ol><li>Right-click the speaker icon by the clock → Sound settings → your speakers → turn <b>Audio enhancements</b> off.</li><li>Plug in the charger and set Power mode to <b>Best performance</b> (Battery saver slows audio).</li><li>Close other apps and tabs that play sound.</li><li>Run Windows Update (it updates the Surface audio driver).</li><li>Try the other browser (Chrome vs Edge).</li></ol>',''];
    if(k==='raw')return['<b>The recordings crackle even on their own.</b> This points at the browser’s audio timing on this device. I’ve switched on the safest settings; send me the code below.','fix'];
    if(k==='chain')return['<b>The crackle starts at the mixer’s volume stage.</b> Send me the code below so I can change that stage.','fix'];
    if(k==='rev')return['<b>The reverb is too heavy for this device.</b> Low-power sound uses a lighter reverb.','fix'];
    if(k==='busy')return['<b>It crackles when many notes play at once</b>'+(slow?' (this device is slow at making sound)':'')+'. Low-power sound and Smooth fix this by playing fewer notes at once and giving the sound more time.','fix'];
    return['<b>It crackles only while the screen is busy.</b> Low-power sound calms the animations.','fix'];
  }
  function draw(){
    var h='<h3>Sound check</h3>';
    if(cur<SC_STEPS.length){
      var st=SC_STEPS[cur];
      h+='<p class="hint">Use the speakers or headphones where you hear the crackle. Listen to each clip (6 seconds) and say whether it was clean.</p>'+
        '<div class="sc-steps">'+SC_STEPS.map(function(x,j){return'<span class="sc-dot'+(j===cur?' cur':'')+(R[x.k]===true?' bad':R[x.k]===false?' good':'')+'">'+(j+1)+'</span>';}).join('')+'</div>'+
        '<div class="sc-card"><div class="sc-n">Clip '+(cur+1)+' of '+SC_STEPS.length+'</div><b>'+st.t+'</b><p class="hint">'+st.d+'</p>'+(st.k==='draw'?'<canvas id="scCanvas" class="sc-canvas"></canvas>':'')+
        '<div class="row"><button class="primary" data-x="play">'+(run?'Playing…':'Play clip')+'</button><span class="grow"></span><button data-x="ok">Clean</button><button data-x="bad" class="warn">Crackly</button></div></div>'+
        '<div class="row" style="justify-content:space-between"><button data-x="back"'+(cur?'':' disabled')+'>Back</button><button data-x="close">Close</button></div>';
    }else{
      var d=diagnose();
      h+='<div class="sc-card">'+d[0]+'</div>'+
        '<p class="hint">Speed test: '+(speed==null?busyMsg||'measuring…':'this device makes sound <b>'+speed.toFixed(0)+'× faster</b> than needed'+(speed<10?' (on the slow side, so Low-power sound is a good idea)':' (plenty of headroom)'))+'</p>'+
        '<label class="shl">Send this code to Claude<input id="scCode" readonly value="'+esc(code())+'"></label>'+
        '<div class="row" style="justify-content:space-between"><span class="row"><button data-x="again">Start over</button><button data-x="copy">Copy code</button></span><span class="row">'+(d[1]==='fix'&&!(LITE&&LAT==='playback')?'<button class="primary" data-x="fix">Use the safest settings</button>':'')+'<button data-x="close">Done</button></span></div>';
    }
    $('mBox').innerHTML=h;
  }
  function stopRun(){if(run){run.stop();run=null;}}
  openModal('',async function(e){
    var b=e.target.closest('button');if(!b)return;var x=b.dataset.x;
    if(x==='close'){stopRun();closeModal();return;}
    if(x==='play'){if(run)return;wakeAudio();await scPrep();run=scRun(SC_STEPS[cur].k,6);draw();var me=run;setTimeout(function(){if(run===me){stopRun();draw();}},6400);return;}
    if(x==='ok'||x==='bad'){stopRun();R[SC_STEPS[cur].k]=x==='bad';cur++;draw();
      if(cur===SC_STEPS.length&&speed==null){busyMsg='measuring…';scBench().then(function(v){speed=v;if(v==null)busyMsg='not available in this browser';draw();});}return;}
    if(x==='back'){stopRun();cur=Math.max(0,cur-1);draw();return;}
    if(x==='again'){R={};cur=0;draw();return;}
    if(x==='copy'){var i=$('scCode');i.select();try{navigator.clipboard.writeText(i.value).then(function(){toast('Code copied');},function(){document.execCommand('copy');toast('Code copied');});}catch(er){document.execCommand('copy');toast('Code copied');}return;}
    if(x==='fix'){try{localStorage.setItem('jr-lite','1');localStorage.setItem('jr-lat','playback');}catch(er){}toast('Restarting with the safest settings…');dbPut('__auto__').then(function(){setTimeout(function(){location.reload();},400);});}
  });
  $('mBox').classList.add('med');draw();
}
window.__jr.soundCheck=openSoundCheck;window.__jr.scBench=scBench;

if(A.c===null&&0){}

(async function boot(){
  var rec=await dbGet('__auto__');
  var ok=false,shared=null,m=/[#&]s=([^&]+)/.exec(location.hash);
  if(m){try{shared=await unpackSong(decodeURIComponent(m[1]));}catch(e){shared=(e&&e.message==='old')?'old':false;}}
  if(shared&&shared!=='old'){
    if(rec&&rec.data&&rec.data.tracks&&rec.data.tracks.some(function(t){return t.notes&&t.notes.length;}))await dbPutRaw('Before shared song',rec);
    try{applyProject(shared,{});ok=true;}catch(e){ok=false;}
    try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
  }else if(rec&&rec.data&&rec.data.tracks&&rec.data.tracks.length){try{applyProject(rec.data,audFromRecord(rec));ok=true;}catch(e){}}
  if(!ok)starter();
  HIST.list=[];HIST.idx=-1;commitHist();
  /* fetch and decode every sound the song uses straight away, so the first notes are not late or silent */
  setTimeout(function(){try{S.tracks.forEach(loadTrackSamples);loadDrumKits();}catch(e){}},250);
  if(INPUT==='midi'&&navigator.requestMIDIAccess)setTimeout(enableMidi,600);
  if(shared&&shared!=='old'&&ok){
    markDirty();
    openModal('<h3>A song for you</h3><p class="hint">“'+esc(S.name)+'” was shared with you. Press Play to hear it, then change anything you like. It will not change the original.</p><div class="row" style="justify-content:flex-end"><button data-x="close">Look around</button><button class="primary" data-x="play">Play it</button></div>',
      function(e){var b=e.target.closest('button');if(!b)return;closeModal();if(b.dataset.x==='play')$('bPlay').click();});
  }else if(shared==='old')toast('This browser is too old to open that link. Update Safari or Chrome.');
  else if(shared===false)toast('That song link looks cut off. Ask for it again.');
})();})();
